<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Miedird TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4fb;--card:#fff;--ink:#1b1630;--mute:#6a6384;--line:#e3deef;--acc:#a8650b;--accbg:#f3e2c6;--hero1:#2a1f5c;--hero2:#4b2f86;--herotx:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#110d24;--card:#1b1535;--ink:#f1eefb;--mute:#a49dc2;--line:#2c2450;--acc:#e8b24f;--accbg:#3a2d12;--hero1:#2a1f5c;--hero2:#4b2f86}}
:root[data-theme="dark"]{--bg:#110d24;--card:#1b1535;--ink:#f1eefb;--mute:#a49dc2;--line:#2c2450;--acc:#e8b24f;--accbg:#3a2d12}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0;line-height:1.2}
header{padding:18px 18px 6px}
header h1{font-size:22px}
header p{margin:2px 0 0;color:var(--mute);font-size:14px}
main{padding:12px 18px;max-width:640px;margin:0 auto}
.hero{display:block;width:100%;text-align:left;border:0;border-radius:18px;padding:22px 20px;min-height:210px;color:var(--herotx);background:linear-gradient(150deg,var(--hero1),var(--hero2));cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;font:inherit}
.hero small{opacity:.8;font-size:13px}
.hero h2{font-size:25px}
.hero span{align-self:flex-start;background:var(--accbg);color:var(--acc);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600}
section{margin-top:26px}
section>h3{font-size:18px;margin-bottom:10px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;color:inherit;font:inherit;cursor:pointer}
.dot{flex:0 0 52px;height:52px;border-radius:10px;background:linear-gradient(150deg,var(--hero1),var(--hero2));display:grid;place-items:center;color:#fff;font-size:18px}
.row b{display:block;font-weight:600;font-size:15px}
.row small{color:var(--mute);font-size:13px}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:14px}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}a.yt{display:inline-block;margin:10px 0;color:var(--acc);font-weight:600}.watch{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-decoration:none;font-weight:600;font-size:17px;background:linear-gradient(150deg,var(--hero1),var(--hero2))}.watch span{font-size:34px}
.back{background:none;border:0;color:var(--acc);font:inherit;font-weight:600;padding:6px 0;cursor:pointer}
a.yt{display:inline-block;margin:10px 0;color:var(--acc);font-weight:600}
textarea{width:100%;min-height:96px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:8px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px;white-space:pre-wrap}
.note small{display:block;color:var(--mute);margin-top:6px}
.note button{float:right;background:none;border:0;color:var(--mute);cursor:pointer;font:inherit;font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:14px 0;font:inherit;font-size:15px;color:var(--mute);cursor:pointer}
nav button[aria-current="true"]{color:var(--acc);font-weight:700}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;align-items:center;gap:14px;max-width:640px;margin:0 auto;padding:16px 18px 8px}
header .logo{flex:0 0 auto;height:68px;width:auto;max-width:42vw;object-fit:contain;background:#fff;border-radius:14px;padding:6px 10px}
header .ht{min-width:0}
header h1{font-size:24px}
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:linear-gradient(160deg,#2a1f5c,#4b2f86);transition:opacity .7s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash img{width:min(72vw,380px);height:auto}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11px}
body{padding-bottom:84px}
.nbtn{margin-left:auto;flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.acard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.acard i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff}
.acard b{font-size:14px;font-weight:600;line-height:1.3}
.banner{border-radius:18px;padding:24px 20px;color:#fff;background:linear-gradient(150deg,var(--hero1),var(--hero2))}
.banner h2{font-size:26px}
.banner p{margin:10px 0 0;opacity:.92;font-size:15px}
.act{display:block;text-align:center;text-decoration:none;background:var(--acc);color:var(--bg);border-radius:12px;padding:13px;font-weight:600;margin-top:10px}
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.bk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 10px;color:inherit;font:inherit;font-size:14px;text-align:left;cursor:pointer}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 0;color:inherit;font:inherit;cursor:pointer}
.read p{margin:0 0 12px;font-size:var(--fs,17px);line-height:1.7;font-family:Georgia,"Times New Roman",serif}
.read sup{color:var(--acc);font-weight:700;margin-right:5px;font-size:.62em;font-family:system-ui,sans-serif}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.fs{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
nav button{min-width:0;font-size:10.5px}
nav button span{white-space:nowrap}
body,button,input,textarea{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
.read p,.read sup{font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
.nbtn{overflow:hidden;padding:0;border-radius:50%}
.nbtn img{width:100%;height:100%;object-fit:cover}
.pcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.pcard small{color:var(--mute)}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--accbg);color:var(--acc);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.av.big{width:120px;height:120px}
.av svg{width:55%;height:55%}
.ctr{display:flex;justify-content:center;margin:16px 0}
label.up{display:inline-block;cursor:pointer}
.inp{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit}
.ni{display:grid;place-items:center;width:24px;height:24px;font-style:normal}
.ni img{width:24px;height:24px;border-radius:50%;object-fit:cover}
nav button[aria-current="true"] .ni img{outline:2px solid var(--acc);outline-offset:1px}
.row.sm{padding:8px 12px;gap:10px;margin-bottom:8px}
.row.sm .dot{flex:0 0 36px;height:36px;border-radius:8px}
.row.sm .dot svg{width:18px;height:18px}
.row.sm b{font-size:14px}
.row.sm small{font-size:12px}
.grid{gap:10px}
.acard{padding:10px;gap:8px;border-radius:12px}
.acard i{width:34px;height:34px}
.acard i svg{width:18px;height:18px}
.acard b{font-size:13px;line-height:1.25}
#splash::before{content:"";position:absolute;top:50%;left:50%;width:60vmin;height:60vmin;margin:-30vmin 0 0 -30vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);animation:glow 2.4s ease-out both}
#splash img{position:relative;animation:logoIn 1.3s cubic-bezier(.2,.8,.2,1) both,logoGlow 1.5s ease-in-out 1.2s}
@keyframes logoIn{0%{opacity:0;transform:scale(.65);filter:blur(10px)}60%{opacity:1;transform:scale(1.05);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes logoGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,255,255,0))}50%{filter:drop-shadow(0 0 22px rgba(255,255,255,.6))}}
@keyframes glow{0%{transform:scale(.3);opacity:0}40%{opacity:1}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash img,#splash::before{animation:none}}
.ctb{margin-top:10px}
.ctb small{display:block;color:var(--mute)}
.act.sm{padding:9px;font-size:14px;margin-top:8px}
.ctb .act{text-align:left;padding-left:14px}
.fl{display:block;margin-top:14px;margin-bottom:4px;font-weight:500;font-size:14px}
.rad{display:flex;gap:18px;margin-top:6px}
.rad label{display:flex;gap:6px;align-items:center}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:14px}
.chk input{margin-top:3px}
select.inp{appearance:auto}
.lbl{display:block;color:var(--acc);font-weight:700;font-size:13px;margin-bottom:2px}
:root{padding-top:0}
header{max-width:none;margin:0;background:#fff;border-bottom:1px solid #e3e7f5;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) max(18px,calc((100% - 640px)/2)) 10px}
header .logo{background:none;border-radius:0;padding:0;height:62px;width:auto;max-width:44vw}
header h1,header p{color:#1f3fbf}
header h1{font-size:22px}
header p{margin:2px 0 0;font-size:14px;font-weight:500}
header .nbtn{background:#eef1fb;border:1px solid #dfe5f7;color:#1f3fbf}
.pcard2{position:relative;display:block;width:100%;padding:0;border:0;border-radius:18px;overflow:hidden;cursor:pointer;aspect-ratio:4/5;background:#0b2f33;color:#fff;text-align:left;font:inherit}
.pcard2 img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.pov{position:absolute;left:0;right:0;bottom:0;padding:64px 16px 16px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent);display:flex;flex-direction:column;gap:2px}
.pov small{opacity:.92;font-size:13px}
.pov b{font-size:19px;line-height:1.25}
.pov i{font-style:normal;font-size:13px;color:#ffd48a;margin-top:6px}
.phero{width:100%;max-height:70vh;object-fit:cover;object-position:50% 20%;border-radius:18px;display:block;margin:6px 0 14px}
.ptitle{margin:2px 0 0;color:var(--acc);font-weight:700}
.ptxt p{line-height:1.7}
</style>
</head>

<script>

var S={notes:{},last:null};
function load(){try{S.notes=JSON.parse(localStorage.getItem("me_notes")||"{}");S.last=localStorage.getItem("me_last")}catch(e){}}

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

 tab(p);window.scrollTo(0,0);
 if(p==="home"){

function notes(id){

}
function addNote(id){

}

function pasteurCard(){
 var p=CONFIG.pasteur;if(!p||!p.nom)return '';
 return '<section><button class="pcard2" onclick="go(\'pasteur\')"><img alt="'+esc(p.nom)+'" src="'+PASTEUR_IMG+'"><span class="pov"><small>'+esc(p.titre)+'</small><b>'+esc(p.nom)+'</b><i>Lire son parcours ›</i></span></button></section>';
}
function pasteur(){
 var p=CONFIG.pasteur,t=p.parcours?p.parcours.split(/\n\s*\n/).map(function(x){return '<p>'+esc(x)+'</p>'}).join(""):'<p class="empty">Son parcours sera ajouté bientôt.</p>';
 app.innerHTML='<button class="back" onclick="go(\'eglises\')">‹ Églises</button><img class="phero" alt="'+esc(p.nom)+'" src="'+PASTEUR_IMG+'"><h2>'+esc(p.nom)+'</h2><p class="ptitle">'+esc(p.titre)+'</p><section class="ptxt">'+t+'</section>';
 window.scrollTo(0,0);
}

// ====== BIBLE HORS LIGNE (IndexedDB) ======
var DL={run:false};
function idb(){return new Promise(function(res,rej){var r=indexedDB.open("me_bible",1);r.onupgradeneeded=function(){r.result.createObjectStore("bk")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej()}})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("bk").objectStore("bk").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){res(null)}})})}
function idbSet(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t=d.transaction("bk","readwrite");t.objectStore("bk").put(v,k);t.oncomplete=res;t.onerror=rej})})}
function idbKeys(){return idb().then(function(d){return new Promise(function(res){var q=d.transaction("bk").objectStore("bk").getAllKeys();q.onsuccess=function(){res(q.result)};q.onerror=function(){res([])}})})}
function offStatus(){
 var e=document.getElementById("offl");if(!e)return;
 if(!window.indexedDB){e.innerHTML="";return}
 idbKeys().then(function(k){
  var n=k.length,x=document.getElementById("offl");if(!x||DL.run)return;
  x.innerHTML=n>=66?'<p class="empty">✓ Bible téléchargée : tu peux la lire sans internet.</p>':'<p class="empty">Lecture sans internet : '+n+'/66 livres téléchargés.</p><button class="btn" onclick="dlBible()">'+(n?"Continuer le téléchargement":"Télécharger la Bible")+'</button>';
 }).catch(function(){});
}
function dlBible(){
 if(DL.run||!window.indexedDB)return;DL.run=true;
 function say(t,retry){var x=document.getElementById("offl");if(x)x.innerHTML='<p class="empty">'+t+'</p>'+(retry?'<button class="btn" onclick="dlBible()">Réessayer</button>':'')}
 idbKeys().then(function(have){
  var n=1;
  (function nx(){
   while(n<=66&&have.indexOf("ls_"+n)>-1)n++;
   if(n>66){DL.run=false;offStatus();return}
   say("Téléchargement… "+(n-1)+"/66 ("+BOOKS[n-1].name+"). Garde l\'écran allumé.");
   fetch("https://api.getbible.net/v2/ls1910/"+n+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var o={};(j.chapters||[]).forEach(function(c){o[c.chapter]=(c.verses||[]).map(function(x){return[x.verse,x.text]})});
    if(!Object.keys(o).length)throw 0;
    return idbSet("ls_"+n,o);
   }).then(function(){n++;nx()}).catch(function(){DL.run=false;say("Téléchargement interrompu au livre « "+BOOKS[n-1].name+" ». Vérifie ta connexion, puis réessaie.",true)});
  })();
 }).catch(function(){DL.run=false});
}
if("serviceWorker" in navigator){try{navigator.serviceWorker.register("sw.js")}catch(e){}}
load();fbInit();go("home");introSound();
setTimeout(function(){document.getElementById("splash").classList.add("hide")},3000);
</script>
